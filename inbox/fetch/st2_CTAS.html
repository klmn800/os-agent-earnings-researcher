<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="robots" content="noindex">
  <title>Too Many Requests | Stock Titan</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .main {
      background-color: #192530;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 520px;
    }
    .error-code {
      font-size: 4em;
      color: #339bc6;
    }
    h1, h2 {
      color: #fff;
    }
    .lead {
      color: #ddd;
    }
    .note {
      color: #9fb3c2;
      font-size: 0.9em;
    }
    .help-actions a {
      display: inline-block;
      margin: 5px;
      padding: 10px 20px;
      color: #afd0ee;
      background-color: #343a40;
      border-radius: 4px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .help-actions a:hover {
      background-color: #339bc6;
    }
    .header-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      margin-right: 20px;
    }
    h1 {
      margin: 0;
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="main">
      <div class="header-wrapper">
        <picture>
          <source srcset="https://static.stocktitan.net/img/stock-titan-logo.webp" type="image/webp">
          <source srcset="https://static.stocktitan.net/img/stock-titan-logo.png" type="image/png">
          <img src="https://static.stocktitan.net/img/stock-titan-logo.webp" class="logo" alt="Stock Titan" width="64" height="64">
        </picture>
        <h1>Just a moment</h1>
      </div>
      <div class="error-code">429</div>
      <h2>Too Many Requests</h2>
      
      <p class="lead">You&#39;re loading pages faster than our rate limits allow. This is a brief, automatic cooldown, not a block. Please wait 10 seconds before continuing.</p>
      
      
      <hr/>
      <div class="help-actions">
        <a href="javascript:history.back();">Back to Previous Page</a>
        <a href="/">Home Page</a>
      </div>
    </div>
  </div>
</body>
</html>
